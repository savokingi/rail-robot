<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерфейс управления устройством</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
    margin: 0;
    padding: 12px;
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin: 8px 0 16px;
    font-weight: 600;
  }
  .block {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    flex: 1 1 120px;
    min-height: 44px;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #bbb;
    border-radius: 4px;
    background: #f0f0f0;
    color: #222;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  button:active { background: #ddd; }
  button.success { background:#2ecc71; color:#fff; border-color:#27ae60; }
  button.success:active { background:#27ae60; }
  button.primary { background:#3498db; color:#fff; border-color:#2980b9; }
  button.primary:active { background:#2980b9; }
  button.warning { background:#f39c12; color:#fff; border-color:#e67e22; }
  button.warning:active { background:#e67e22; }
  
  button.alarm-btn { background:#f39c12; color:#fff; border-color:#e67e22; }
  button.alarm-btn:active { background:#e67e22; }
  button.alarm-btn.active { background:#e74c3c; border-color:#c0392b; }
  
  button.mark-btn { background:#9b59b6; color:#fff; border-color:#8e44ad; }
  button.mark-btn:active { background:#8e44ad; }
  
  button.siren-btn { background:#9b59b6; color:#fff; border-color:#8e44ad; }
  button.siren-btn:active { background:#8e44ad; }
  button.siren-btn.active { background:#e74c3c; color:#fff; border-color:#c0392b; }
  button.siren-btn.active:active { background:#c0392b; }
  
  .mode-label {
    margin-top: 10px; font-size: 14px; color: #666; text-align: center;
  }
  .mode-label b { color: #222; }
  .hidden { display: none; }
  
  @media (min-width: 640px) {
    body { max-width: 720px; margin: 0 auto; }
    h1   { font-size: 24px; }
  }
</style>
</head>
<body>
  <h1>Интерфейс управления устройством</h1>

  <div class="block">
    <div class="row">
      <button id="startBtn" class="success" onclick="toggleModeState()">Старт</button>
    </div>
    <div class="mode-label">Текущий режим: <b id="modeLabel">Ручной</b></div>
  </div>

  <div class="block">
    <div class="row">
      <button class="mark-btn" onclick="sendCmd('mark_defect')">Маркировать дефект</button>
      <button id="sirenBtn" class="siren-btn" onclick="toggleSiren()">Сирена</button>
    </div>
  </div>

  <div class="block hidden" id="manualBlock">
    <div class="row">
      <button onclick="sendCmd('transport')">Транспортировка</button>
      <button onclick="sendCmd('fold')">Сложиться</button>
      <button onclick="sendCmd('unfold')">Разложиться</button>
      <button
        onmousedown="startMove('forward')"
        onmouseup="stopMove()"
        onmouseleave="stopMove()"
        ontouchstart="startMove('forward', event)"
        ontouchend="stopMove(event)"
        ontouchcancel="stopMove(event)">Вперёд</button>
      <button
        onmousedown="startMove('backward')"
        onmouseup="stopMove()"
        onmouseleave="stopMove()"
        ontouchstart="startMove('backward', event)"
        ontouchend="stopMove(event)"
        ontouchcancel="stopMove(event)">Назад</button>
    </div>
  </div>

  <div class="block hidden" id="autoBlock">
    <div class="row">
      <button class="primary" id="trainBtn" onclick="sendCmd('train')">Поезд!</button>
    </div>
  </div>

  <div class="block">
    <div class="row">
      <button id="alarmBtn" class="alarm-btn" onclick="sendCmd('alarm')">Авария</button>
    </div>
  </div>

<script>
let state = {
  auto: false, alarm: false, trRun: false,
  sirenOn: false, mSt: '--'
};

function fetchJSON(url) {
  return fetch(url, { cache: 'no-store' }).then(r => r.json());
}

function sendCmd(cmd) {
  fetchJSON('/api/command?cmd=' + encodeURIComponent(cmd))
    .then(updateUI).catch(console.error);
}

function startMove(cmd, e) {
  if (e) e.preventDefault();
  sendCmd(cmd);
}

function stopMove(e) {
  if (e) e.preventDefault();
  sendCmd('stop');
}

function toggleModeState() {
  const newAuto = !state.auto;
  fetchJSON('/api/mode?auto=' + (newAuto ? '1' : '0'))
    .then(updateUI).catch(console.error);
}

function toggleSiren() {
  const newOn = !state.sirenOn;
  fetchJSON('/api/command?cmd=' + (newOn ? 'siren_on' : 'siren_off'))
    .then(updateUI).catch(console.error);
}

function updateSirenBtn() {
  const b = document.getElementById('sirenBtn');
  b.textContent = state.sirenOn ? 'Сирена: ВКЛ' : 'Сирена';
  b.classList.toggle('active', !!state.sirenOn);
}

function updateUI(s) {
  if (s) state = s;

  const sBtn = document.getElementById('startBtn');
  sBtn.textContent = state.auto ? 'Стоп' : 'Старт';
  sBtn.classList.toggle('active', state.auto);

  document.getElementById('modeLabel').textContent = state.auto ? 'Автономный' : 'Ручной';
  document.getElementById('manualBlock').classList.toggle('hidden',  state.auto);
  document.getElementById('autoBlock').classList.toggle('hidden',   !state.auto);

  const tBtn = document.getElementById('trainBtn');
  if (state.trRun) {
    tBtn.textContent = 'Вернуться на рельсы';
    tBtn.className = 'warning';
  } else {
    tBtn.textContent = 'Поезд!';
    tBtn.className = 'primary';
  }

  const aBtn = document.getElementById('alarmBtn');
  if (state.alarm) {
    aBtn.textContent = 'Сброс аварии';
    aBtn.classList.add('active');
  } else {
    aBtn.textContent = 'Авария';
    aBtn.classList.remove('active');
  }

  updateSirenBtn();
}

function poll() {
  fetchJSON('/api/status').then(updateUI).catch(console.error);
}

setInterval(poll, 1000);
poll();
</script>
</body>
</html>
